spring:
  application:
    name: bank-communication-platform

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5435/bankcomm}
    username: ${DATABASE_USER:bankuser}
    password: ${DATABASE_PASSWORD:bankpass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: BankCommHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: snappy
    consumer:
      group-id: bank-comm-consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.ford.bank.kafka.event"
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080}
          # For dev mode, we use a local key
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:dev-public-key.pem}

server:
  port: ${SERVER_PORT:8088}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
      validate-group-membership: false
      group:
        liveness:
          include: livenessState,diskSpace
        readiness:
          include: readinessState,db,kafka
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    kafka:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    com.ford.bank: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  kafka:
    topics:
      campaign-scheduled: bank.campaign.scheduled
      job-created: bank.communication.job.created
      job-requested: bank.communication.job.requested
      attempt-completed: bank.communication.attempt.completed
      attempt-failed: bank.communication.attempt.failed
      voice-call-completed: bank.voice.call.completed
      sms-delivery-updated: bank.sms.delivery.updated
      agent-task-created: bank.agent.task.created
      collection-case-updated: bank.collection.case.updated
      dead-letter: bank.dead.letter
    retry-topic-suffix: ".retry"
    dlt-suffix: ".dlt"
    consumer:
      max-retry-attempts: 3
  outbox:
    batch-size: 100
    poll-interval-ms: 5000
    lock-timeout-seconds: 30
  scheduling:
    job-batch-size: 50
    job-poll-interval-ms: 10000
  provider:
    mode: SIMULATED
    simulated:
      success-rate: 0.85
      timeout-rate: 0.05
      failure-rate: 0.10
  security:
    dev-mode: ${SECURITY_DEV_MODE:true}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  pagination:
    default-page-size: 20
    max-page-size: 100
